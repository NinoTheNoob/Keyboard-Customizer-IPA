name: Build unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies & Generate Config
        run: |
          flutter pub get
          flutter precache --ios

      - name: Create Dummy Generated.xcconfig if missing
        run: |
          mkdir -p ios/Flutter
          touch ios/Flutter/Generated.xcconfig
          echo "FLUTTER_ROOT=/Users/runner/hostedtoolcache/flutter" >> ios/Flutter/Generated.xcconfig
          echo "FLUTTER_BUILD_DIR=build" >> ios/Flutter/Generated.xcconfig

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS app directly with xcodebuild
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package app as IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r keyboard.ipa Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-unsigned-ipa
          path: keyboard.ipa
